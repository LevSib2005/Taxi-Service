spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    user:
      name: user
      password: password
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/auth/jwks

  cloud:
    gateway:
      enabled: false
      routes:
        - id: example_route
          uri: http://example.com
          predicates:
            - Path=/example/**
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic

  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics, prometheus
    endpoint:
      health:
        show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-servers:
    - url: http://localhost:8000
      description: API Gateway

gateway:
  secret: ${JWT_SECRET:dev-secret-key-min-32-chars-for-hmac-sha256}
  issuer: ${JWT_ISSUER:user-service}
  header: ${JWT_HEADER:X-Gateway-Header}
  header-key: ${HEADER_KEY:dev-secret-key-for-microservices}
  access-token-ttl: 900000

server:
  port: 8080

logging:
  level:
    com.example: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN