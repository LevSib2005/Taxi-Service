server:
  port: 8000
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/passengers/**, /drivers/**, /auth/**

            - id: trip-service
              uri: http://localhost:8082
              predicates:
                - Path=/trips/**

            - id: user-service-api-docs
              uri: http://localhost:8080
              predicates:
                - Path=/user-service/api-docs/**
              filters:
                - RewritePath=/user-service/api-docs(?<path>.*), /api-docs$\{path}

            - id: trip-service-api-docs
              uri: http://localhost:8082
              predicates:
                - Path=/trip-service/api-docs/**
              filters:
                - RewritePath=/trip-service/api-docs(?<path>.*), /api-docs$\{path}

            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/notifications/**

            - id: notification-service-api-docs
              uri: http://localhost:8083
              predicates:
                - Path=/notification-service/api-docs/**
              filters:
                - RewritePath=/notification-service/api-docs(?<path>.*), /api-docs$\{path}

gateway:
  secret: ${JWT_SECRET:dev-secret-key-min-32-chars-for-hmac-sha256}
  issuer: ${JWT_ISSUER:user-service}
  header: ${JWT_HEADER:X-Gateway-Header}
  header-key: ${HEADER_KEY:dev-secret-key-for-microservices}
  open-routes:
    - /actuator/
    - /swagger-ui/
    - /swagger-ui.html
    - /user-service/api-docs
    - /trip-service/api-docs
    - /webjars/
    - /api-docs/

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/api-docs
      - name: trip-service
        url: /trip-service/api-docs
      - name: notification-service
        url: /notification-service/api-docs
    persistent-auth: true
    display-request-duration: true

logging:
  level:
    com.example.gateway_service: DEBUG
    org.springframework.cloud.gateway: INFO