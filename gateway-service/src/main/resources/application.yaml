server:
  port: 8000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/passengers/**, /drivers/**, /auth/**

gateway:
  secret: ${JWT_SECRET:dev-secret-key-min-32-chars-for-hmac-sha256}
  issuer: ${JWT_ISSUER:user-service}
  header: ${JWT_HEADER:X-Gateway-Header}
  header-key: ${HEADER_KEY:dev-secret-key-for-microservices}
  open-routes:
    - /actuator/
    - /swagger-ui/
    - /swagger-ui.html
    - /webjars/